[project]
name = "previs-pipeline"
version = "0.1.0"
description = "Blender previs to AI video provider handoff (R1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
previs-pipeline = "previs_pipeline.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["previs_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["previs/tests"]
pythonpath = ["."]
